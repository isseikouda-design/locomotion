<body>

<!-- =========================
     PC / SP Flat UI
========================= -->

<header class="pc-flat-ui">
  <div class="pc-flat-top">
    <button class="pc-brand-btn" type="button" data-panel="about">
      Locomotion™ 💫💫💫
    </button>

    <a class="pc-mail-link" href="mailto:info@locomotion_service.com">
      info@locomotion_service.com
    </a>

    <button class="pc-cart-btn" type="button">
  <span class="pc-cart-label">(open the cart)</span>
  <span class="pc-cart-count" aria-hidden="true"></span>
</button>

  </div>

<div class="pc-scene-row">
  <button id="pcPlusBtn" class="pc-plus-btn" type="button">{🏃🏃🏃}</button>
  <nav id="pcSceneStrip" class="pc-scene-strip" aria-label="scene navigation"></nav>
</div>

<div id="pcPlusText" class="pc-plus-text" aria-hidden="true">
  <p>
    (Click on a rotating object to go to the product page.)
  </p>
</div>
</header>

<!-- =========================
     3D Canvas
========================= -->
  <canvas id="canvas-home"></canvas>

 <div id="modelLoading" class="model-loading" aria-hidden="true">
  <div
    id="modelLoadingPercent"
    class="model-loading-percent"
  >
    0%
  </div>
</div>

<nav class="pc-bottom-links" aria-label="pc bottom actions">
  <button id="pcInfoTrigger" class="pc-bottom-link" type="button">
    what is this scene?
  </button>

  <button id="pcStarsTrigger" class="pc-bottom-link" type="button">
    let the stars shine!
  </button>

  <button id="pcExplainTrigger" class="pc-bottom-link" type="button">
    explain locomotion™ 🪦
  </button>

  <button id="pcPrivacyTrigger" class="pc-bottom-link" type="button">
    privacy is important
  </button>
</nav>
<section id="pcInfoPanel" class="pc-info-panel" aria-hidden="true">
 <button id="pcInfoClose" class="pc-info-close" type="button">×</button>
  <div id="pcInfoContent" class="pc-info-content"></div>
</section>

<section id="cartPanel" class="cart-panel" aria-hidden="true">
  <button id="cartClose" class="cart-close" type="button">×</button>

  <div class="cart-content">
    <h2>Cart</h2>

    <div id="cartItems" class="cart-items">
      <p>Your cart is empty.</p>
    </div>

    <button id="cartCheckoutBtn" class="cart-checkout-btn" type="button">
      (Checkout!)
    </button>
  </div>
</section>
  
  <script type="module" src="./js/main-fixed.js"></script>
 

<!-- =========================
     Overlay / Modal System
========================= -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay__backdrop" data-overlay-close></div>
    <section class="overlay__window" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <button class="overlay__close" type="button" data-overlay-close aria-label="Close">×</button>
      <header class="overlay__head">
        <h2 id="overlayTitle" class="overlay__title"></h2>
      </header>
      <div class="overlay__content" id="overlayContent"></div>
    </section>
  </div>


<!-- =========================
     Star Trail Canvas
========================= -->
<canvas id="trailCanvas" class="trail-canvas" aria-hidden="true"></canvas>

<!-- Star Trail Script -->
<script src="./js/trail.js" defer></script>



</body>
